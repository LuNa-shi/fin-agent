name: Clean Install

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: node scripts/clean-install-gate.mjs
